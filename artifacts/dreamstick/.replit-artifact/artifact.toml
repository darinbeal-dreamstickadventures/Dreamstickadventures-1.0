kind = "web"
previewPath = "/"
title = "DreamStick Adventures"
version = "1.0.0"
id = "artifacts/dreamstick"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20142

[services.development]
run = "pnpm --filter @workspace/dreamstick run dev"

[services.production]
build = ["sh", "-c", "pnpm --filter @workspace/dreamstick run build && CI=true pnpm prune --prod && CI=true pnpm store prune"]
publicDir = "artifacts/dreamstick/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20142"
BASE_PATH = "/"
