<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sample Adventure — DreamStick Adventures</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: #0a0015;
  color: #f4f0ff;
  font-family: 'Nunito', sans-serif;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 32px 16px;
}
.logo {
  font-family: 'Fredoka One', cursive;
  font-size: 2rem;
  color: #f7e96b;
  text-align: center;
  margin-bottom: 4px;
  text-shadow: 0 0 20px rgba(247,233,107,0.4);
}
.logo span { color: #9b6fff; }
.tagline {
  color: #8878bb;
  font-size: 0.9rem;
  text-align: center;
  margin-bottom: 28px;
}
.video-wrap {
  width: 100%;
  max-width: 420px;
  border-radius: 20px;
  overflow: hidden;
  box-shadow: 0 0 60px rgba(147,51,234,0.45), 0 0 0 1px rgba(155,111,255,0.25);
  margin-bottom: 24px;
}
video { display: block; width: 100%; background: #000; }
.cta {
  display: inline-block;
  background: linear-gradient(135deg, #f7e96b, #ffb347);
  color: #1a0a00;
  font-family: 'Fredoka One', cursive;
  font-size: 1.1rem;
  font-weight: 700;
  padding: 14px 32px;
  border-radius: 50px;
  text-decoration: none;
  box-shadow: 0 4px 24px rgba(247,233,107,0.35);
  transition: transform 0.15s, box-shadow 0.15s;
  margin-bottom: 12px;
}
.cta:hover { transform: translateY(-2px); box-shadow: 0 8px 32px rgba(247,233,107,0.5); }
.sub {
  color: #8878bb;
  font-size: 0.8rem;
  text-align: center;
}
</style>
</head>
<body>
  <div class="logo">Dream<span>Stick</span> Adventures ✦</div>
  <div class="tagline">A personalised bedtime story — starring your child</div>

  <div class="video-wrap">
    <video
      src="/api/videos/liam-1783564468855-narrated.mp4"
      controls
      autoplay
      playsinline
      preload="auto"
    >
      Your browser does not support HTML5 video.
    </video>
  </div>

  <a class="cta" href="/free">✦ Get Your Child's Free Story</a>
  <p class="sub">Takes 30 seconds · Ready in ~15 minutes · No payment needed</p>
</body>
</html>
