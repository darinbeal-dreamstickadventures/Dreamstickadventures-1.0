<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DreamStick Adventures — Build Your Character</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: #0e0520;
  color: #f4f0ff;
  font-family: 'Nunito', sans-serif;
  min-height: 100vh;
  padding: 40px 20px;
}
.wrap { max-width: 700px; margin: 0 auto; }
.logo {
  font-family: 'Fredoka One', cursive;
  font-size: 2.2rem;
  color: #f7e96b;
  text-align: center;
  margin-bottom: 6px;
}
.logo span { color: #9b6fff; }
.tagline {
  text-align: center;
  color: #8878bb;
  font-size: 0.95rem;
  margin-bottom: 32px;
}
.card {
  background: #1c0d3a;
  border: 1px solid rgba(155,111,255,0.22);
  border-radius: 24px;
  padding: 32px;
  margin-bottom: 20px;
}
.card-title {
  font-family: 'Fredoka One', cursive;
  font-size: 1.4rem;
  color: #f7e96b;
  margin-bottom: 20px;
}
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 14px; }
.field { display: flex; flex-direction: column; gap: 6px; }
.field.full { grid-column: 1 / -1; }
label { font-size: 0.75rem; font-weight: 700; color: #8878bb; text-transform: uppercase; letter-spacing: 0.5px; }
input, select {
  background: rgba(255,255,255,0.06);
  border: 1px solid rgba(155,111,255,0.25);
  border-radius: 10px;
  color: #f4f0ff;
  font-family: 'Nunito', sans-serif;
  font-size: 0.95rem;
  padding: 10px 14px;
  outline: none;
  transition: border-color 0.2s;
  width: 100%;
}
input:focus, select:focus { border-color: #9b6fff; }
select option { background: #1c0d3a; }
.tags { display: flex; flex-wrap: wrap; gap: 8px; }
.tag {
  background: rgba(155,111,255,0.1);
  border: 1.5px solid rgba(155,111,255,0.25);
  border-radius: 20px;
  padding: 6px 14px;
  font-size: 0.82rem;
  font-weight: 700;
  cursor: pointer;
  color: #8878bb;
  transition: all 0.15s;
  user-select: none;
}
.tag.on {
  background: #9b6fff;
  border-color: #9b6fff;
  color: white;
}
.preview-box {
  background: #0e0520;
  border: 1px solid rgba(155,111,255,0.22);
  border-radius: 16px;
  padding: 20px;
  text-align: center;
  margin-bottom: 20px;
}
.preview-title {
  font-size: 0.75rem;
  font-weight: 700;
  color: #8878bb;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  margin-bottom: 12px;
}
canvas#preview {
  display: block;
  margin: 0 auto;
  width: 200px;
  height: 200px;
}
.submit-btn {
  width: 100%;
  background: linear-gradient(135deg, #9b6fff, #b06fff);
  border: none;
  border-radius: 14px;
  color: white;
  cursor: pointer;
  font-family: 'Fredoka One', cursive;
  font-size: 1.3rem;
  padding: 16px;
  transition: transform 0.15s, box-shadow 0.15s;
  box-shadow: 0 4px 20px rgba(155,111,255,0.4);
}
.submit-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 30px rgba(155,111,255,0.5); }
.submit-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
.success {
  display: none;
  background: rgba(94,255,192,0.1);
  border: 1px solid rgba(94,255,192,0.3);
  border-radius: 16px;
  padding: 40px 30px;
  text-align: center;
}
.success h2 {
  font-family: 'Fredoka One', cursive;
  font-size: 2rem;
  color: #5effc0;
  margin-bottom: 10px;
}
.success p { color: #8878bb; font-size: 1rem; line-height: 1.6; }
@media(max-width:600px) { .grid { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div class="wrap">
  <div class="logo">Dream<span>Stick</span> Adventures ✦</div>
  <div class="tagline">Where every child is the hero of their own story</div>

  <div id="formSection">
    <div class="card">
      <div class="card-title">👤 About Your Child</div>
      <div class="grid">
        <div class="field">
          <label>Child's Name</label>
          <input type="text" id="child_name" placeholder="e.g. Kevin" maxlength="20" oninput="updatePreview()">
        </div>
        <div class="field">
          <label>Age</label>
          <select id="child_age">
            <option value="3">3 years old</option>
            <option value="4">4 years old</option>
            <option value="5">5 years old</option>
            <option value="6" selected>6 years old</option>
            <option value="7">7 years old</option>
            <option value="8">8 years old</option>
            <option value="9">9 years old</option>
            <option value="10">10 years old</option>
          </select>
        </div>
        <div class="field">
          <label>Gender</label>
          <select id="character_type" onchange="updatePreview()">
            <option value="boy" selected>Boy</option>
            <option value="girl">Girl</option>
          </select>
        </div>
        <div class="field">
          <label>Build</label>
          <select id="build" onchange="updatePreview()">
            <option value="tiny">Tiny &amp; speedy</option>
            <option value="short">Short &amp; mighty</option>
            <option value="average" selected>Average</option>
            <option value="tall">Tall &amp; lean</option>
            <option value="big">Big &amp; strong</option>
          </select>
        </div>
        <div class="field full">
          <label>Parent Email</label>
          <input type="email" id="parent_email" placeholder="your@email.com">
        </div>
      </div>
    </div>

    <div class="card">
      <div class="card-title">🐉 Sidekick &amp; Adventure</div>
      <div class="grid">
        <div class="field">
          <label>Sidekick</label>
          <select id="sidekick" onchange="updatePreview()">
            <option value="none">No sidekick</option>
            <option value="dog">🐶 Dog</option>
            <option value="cat">🐱 Cat</option>
            <option value="dragon">🐉 Baby Dragon</option>
            <option value="robot">🤖 Robot Buddy</option>
            <option value="unicorn">🦄 Unicorn</option>
          </select>
        </div>
        <div class="field full">
          <label>Favorite Adventure Theme</label>
          <div class="tags" id="themeTags">
            <div class="tag on" data-v="space">🚀 Space</div>
            <div class="tag" data-v="underwater">🌊 Underwater</div>
            <div class="tag" data-v="jungle">🌿 Jungle</div>
            <div class="tag" data-v="superhero">⚡ Superhero</div>
            <div class="tag" data-v="princess">👑 Princess</div>
            <div class="tag" data-v="dinosaurs">🦕 Dinosaurs</div>
            <div class="tag" data-v="magic">🔮 Magic</div>
            <div class="tag" data-v="pirates">🏴‍☠️ Pirates</div>
          </div>
        </div>
      </div>
    </div>

    <div class="preview-box">
      <div class="preview-title">Character Preview</div>
      <canvas id="preview" width="220" height="220"></canvas>
    </div>

    <button class="submit-btn" id="submitBtn" onclick="submitCharacter()">
      ✦ Save My Child's Character
    </button>
  </div>

  <div class="success" id="successSection">
    <h2>🌟 Adventure Awaits!</h2>
    <p id="successMsg"></p>
  </div>
</div>

<script>
var selectedTheme = 'space';

document.querySelectorAll('.tag').forEach(function(tag) {
  tag.addEventListener('click', function() {
    document.querySelectorAll('.tag').forEach(function(t) { t.classList.remove('on'); });
    tag.classList.add('on');
    selectedTheme = tag.dataset.v;
  });
});

var SIDEKICK_EMOJI = { dog:'🐶', cat:'🐱', dragon:'🐉', robot:'🤖', unicorn:'🦄' };

function updatePreview() {
  var canvas = document.getElementById('preview');
  var ctx = canvas.getContext('2d');
  var W = canvas.width, H = canvas.height;
  ctx.clearRect(0, 0, W, H);

  var gender  = document.getElementById('character_type').value;
  var build   = document.getElementById('build').value;
  var sidekick = document.getElementById('sidekick').value;
  var name    = document.getElementById('child_name').value.trim();

  // Build affects vertical scale of body
  var scaleMap = { tiny: 0.72, short: 0.84, average: 1.0, tall: 1.14, big: 1.1 };
  var sc = scaleMap[build] || 1.0;
  // Big build = wider too
  var wsc = (build === 'big') ? 1.22 : (build === 'tiny' ? 0.85 : 1.0);

  var cx = sidekick && sidekick !== 'none' ? W * 0.40 : W / 2;
  var groundY = H - 28;
  var bodyH = 68 * sc;
  var headR = 18 * Math.sqrt(sc) * wsc;
  var torsoH = 34 * sc;
  var legH   = 26 * sc;
  var armLen = 22 * sc;
  var bodyW  = 12 * wsc;

  var footY  = groundY;
  var hipY   = footY - legH;
  var shouldY = hipY - torsoH;
  var headCY = shouldY - headR - 2;

  // Soft gold glow behind character
  var grd = ctx.createRadialGradient(cx, hipY, 4, cx, hipY, 70 * sc);
  grd.addColorStop(0, 'rgba(247,233,107,0.18)');
  grd.addColorStop(1, 'transparent');
  ctx.fillStyle = grd;
  ctx.fillRect(0, 0, W, H);

  // Ground shadow
  ctx.beginPath();
  ctx.ellipse(cx, footY + 3, 18 * wsc, 4, 0, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(0,0,0,0.22)';
  ctx.fill();

  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';

  // Legs
  ctx.strokeStyle = '#f7e96b'; ctx.lineWidth = 6 * wsc;
  ctx.beginPath(); ctx.moveTo(cx - 5 * wsc, hipY); ctx.lineTo(cx - 7 * wsc, footY); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(cx + 5 * wsc, hipY); ctx.lineTo(cx + 7 * wsc, footY); ctx.stroke();

  // Torso
  ctx.lineWidth = bodyW;
  ctx.beginPath(); ctx.moveTo(cx, shouldY); ctx.lineTo(cx, hipY); ctx.stroke();

  // Arms — girl has slightly raised arms
  var armAngle = (gender === 'girl') ? 0.4 : 0.2;
  ctx.lineWidth = 5 * wsc;
  ctx.beginPath();
  ctx.moveTo(cx, shouldY + 8 * sc);
  ctx.lineTo(cx - armLen, shouldY + 8 * sc + armLen * Math.sin(armAngle));
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(cx, shouldY + 8 * sc);
  ctx.lineTo(cx + armLen, shouldY + 8 * sc + armLen * Math.sin(armAngle));
  ctx.stroke();

  // Head
  ctx.beginPath();
  ctx.arc(cx, headCY, headR, 0, Math.PI * 2);
  ctx.fillStyle = '#f7e96b';
  ctx.fill();
  ctx.strokeStyle = '#f7e96b';
  ctx.lineWidth = 2;
  ctx.stroke();

  // Eyes
  ctx.fillStyle = '#1c0d3a';
  ctx.beginPath(); ctx.arc(cx - headR * 0.32, headCY - 1, 2.2, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(cx + headR * 0.32, headCY - 1, 2.2, 0, Math.PI * 2); ctx.fill();
  // Eye shine
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.arc(cx - headR * 0.32 + 0.8, headCY - 2, 0.9, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(cx + headR * 0.32 + 0.8, headCY - 2, 0.9, 0, Math.PI * 2); ctx.fill();

  // Smile
  ctx.strokeStyle = '#1c0d3a'; ctx.lineWidth = 1.6;
  ctx.beginPath();
  ctx.arc(cx, headCY + 3, 6, 0.15, Math.PI - 0.15);
  ctx.stroke();

  // Hair — boy: short cap, girl: longer flowing
  ctx.fillStyle = '#f7e96b';
  if (gender === 'boy') {
    ctx.beginPath();
    ctx.arc(cx, headCY - 2, headR, Math.PI + 0.3, 0 - 0.3);
    ctx.fill();
  } else {
    // Long hair sides
    ctx.beginPath(); ctx.arc(cx, headCY - 2, headR, Math.PI, 0); ctx.fill();
    ctx.strokeStyle = '#f7e96b'; ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.moveTo(cx - headR, headCY + 4);
    ctx.quadraticCurveTo(cx - headR - 7, headCY + 20, cx - headR - 2, headCY + 32 * sc);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(cx + headR, headCY + 4);
    ctx.quadraticCurveTo(cx + headR + 7, headCY + 20, cx + headR + 2, headCY + 32 * sc);
    ctx.stroke();
  }

  // Name label
  if (name) {
    ctx.font = 'bold 11px Nunito, sans-serif';
    ctx.fillStyle = '#f7e96b';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'top';
    ctx.fillText(name, cx, 6);
  }

  // Sidekick emoji
  if (sidekick && sidekick !== 'none') {
    var emoji = SIDEKICK_EMOJI[sidekick] || '';
    if (emoji) {
      var skX = W * 0.75;
      var skY = hipY - 8 * sc;
      // Subtle glow behind sidekick
      var skGrd = ctx.createRadialGradient(skX, skY, 2, skX, skY, 26);
      skGrd.addColorStop(0, 'rgba(247,233,107,0.18)');
      skGrd.addColorStop(1, 'transparent');
      ctx.fillStyle = skGrd;
      ctx.fillRect(skX - 26, skY - 26, 52, 52);

      ctx.font = '36px serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(emoji, skX, skY);
    }
  }
}

async function submitCharacter() {
  var name  = document.getElementById('child_name').value.trim();
  var email = document.getElementById('parent_email').value.trim();
  var age   = document.getElementById('child_age').value;

  if (!name)  { alert("Please enter your child's name"); return; }
  if (!email || !email.includes('@')) { alert('Please enter a valid email address'); return; }

  var btn = document.getElementById('submitBtn');
  btn.disabled = true;
  btn.textContent = 'Saving...';

  var character = {
    parent_email:       email,
    child_name:         name,
    child_age:          parseInt(age),
    character_type:     document.getElementById('character_type').value,
    build:              document.getElementById('build').value,
    sidekick:           document.getElementById('sidekick').value,
    theme:              selectedTheme,
    subscription_status: 'waitlist'
  };

  try {
    var response = await fetch('/api/character', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(character)
    });
    var result = await response.json();
    if (result.success) {
      document.getElementById('formSection').style.display = 'none';
      document.getElementById('successSection').style.display = 'block';
      document.getElementById('successMsg').textContent =
        name + "'s character has been saved! Your first personalized bedtime adventure arrives soon. Get ready for the magic! 🌟";
    } else {
      alert('Something went wrong. Please try again.');
      btn.disabled = false;
      btn.textContent = '✦ Save My Child\'s Character';
    }
  } catch(e) {
    alert('Connection error. Please try again.');
    btn.disabled = false;
    btn.textContent = '✦ Save My Child\'s Character';
  }
}

updatePreview();
</script>
<div style="text-align:center;padding:24px 0 8px;font-size:0.8rem;color:#8878bb;">
  <a href="/privacy" style="color:#9b6fff;text-decoration:none;">Privacy Policy</a> &nbsp;·&nbsp;
  <a href="/terms" style="color:#9b6fff;text-decoration:none;">Terms of Service</a>
</div>
</body>
</html>
