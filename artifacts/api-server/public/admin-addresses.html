<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Shipping Addresses — DreamStick Admin</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  min-height: 100vh;
  background: #0e0520;
  color: #f4f0ff;
  font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  padding: 40px 20px;
}
.wrap { width: min(1180px, 100%); margin: 0 auto; }
.header {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 20px;
  margin-bottom: 24px;
}
.eyebrow {
  color: #a78bfa;
  font-size: 0.75rem;
  font-weight: 800;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  margin: 0 0 7px;
}
h1 { font-size: clamp(1.65rem, 4vw, 2.5rem); margin: 0; }
.count { color: #a898d8; margin: 7px 0 0; }
button {
  background: #f7e96b;
  border: 0;
  border-radius: 10px;
  color: #160930;
  cursor: pointer;
  font: inherit;
  font-weight: 800;
  padding: 11px 17px;
}
button:disabled { cursor: wait; opacity: 0.65; }
.panel {
  background: #160930;
  border: 1px solid #2d1660;
  border-radius: 16px;
  box-shadow: 0 18px 60px rgba(0, 0, 0, 0.25);
  overflow: hidden;
}
.table-wrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; min-width: 850px; }
th, td {
  border-bottom: 1px solid #2d1660;
  padding: 16px 18px;
  text-align: left;
  vertical-align: top;
}
th {
  background: #1e0d40;
  color: #c4b5fd;
  font-size: 0.75rem;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}
td { color: #e8e1fa; font-size: 0.92rem; line-height: 1.55; }
tbody tr:last-child td { border-bottom: 0; }
tbody tr:hover { background: rgba(155, 111, 255, 0.06); }
.muted { color: #8878bb; }
.address { white-space: pre-line; }
.status {
  color: #a898d8;
  padding: 42px 24px;
  text-align: center;
}
.error { color: #fca5a5; }
@media (max-width: 640px) {
  body { padding: 24px 12px; }
  .header { align-items: flex-start; flex-direction: column; }
}
</style>
</head>
<body>
<main class="wrap">
  <header class="header">
    <div>
      <p class="eyebrow">DreamStick Admin</p>
      <h1>Shipping Addresses</h1>
      <p class="count" id="count">Loading submissions…</p>
    </div>
    <button id="refresh" type="button">Refresh</button>
  </header>

  <section class="panel">
    <div id="status" class="status">Loading addresses…</div>
    <div id="table-wrap" class="table-wrap" hidden>
      <table>
        <thead>
          <tr>
            <th>Name</th>
            <th>Full address</th>
            <th>Date submitted</th>
            <th>Email address</th>
            <th>Squishy</th>
          </tr>
        </thead>
        <tbody id="addresses"></tbody>
      </table>
    </div>
  </section>
</main>

<script>
const count = document.getElementById('count');
const status = document.getElementById('status');
const tableWrap = document.getElementById('table-wrap');
const tableBody = document.getElementById('addresses');
const refreshButton = document.getElementById('refresh');

function valueOrDash(value) {
  return typeof value === 'string' && value.trim() ? value.trim() : '—';
}

function fullAddress(address) {
  const region = [address.state, address.postal_code].filter(Boolean).join(' ');
  const locality = [address.city, region].filter(Boolean).join(', ');
  return [address.address_line1, address.address_line2, locality, address.country]
    .filter(Boolean)
    .join('\n') || '—';
}

function addCell(row, text, className) {
  const cell = document.createElement('td');
  cell.textContent = text;
  if (className) cell.className = className;
  row.appendChild(cell);
}

function renderAddresses(addresses) {
  tableBody.replaceChildren();
  count.textContent = `${addresses.length} submission${addresses.length === 1 ? '' : 's'}`;

  if (addresses.length === 0) {
    status.textContent = 'No shipping addresses have been submitted yet.';
    status.className = 'status';
    status.hidden = false;
    tableWrap.hidden = true;
    return;
  }

  for (const address of addresses) {
    const row = document.createElement('tr');
    addCell(row, valueOrDash(address.recipient_name));
    addCell(row, fullAddress(address), 'address');
    addCell(row, new Date(address.submitted_at).toLocaleString());
    addCell(row, valueOrDash(address.parent_email));
    addCell(row, address.squishy_claimed ? 'CLAIMED' : 'No claim');
    tableBody.appendChild(row);
  }

  status.hidden = true;
  tableWrap.hidden = false;
}

async function loadAddresses() {
  refreshButton.disabled = true;
  status.textContent = 'Loading addresses…';
  status.className = 'status';
  status.hidden = false;

  try {
    const response = await fetch('/api/admin/addresses', { credentials: 'same-origin' });
    const payload = await response.json().catch(() => ({}));
    if (!response.ok) throw new Error(payload.error || 'Unable to load addresses');
    renderAddresses(Array.isArray(payload.addresses) ? payload.addresses : []);
  } catch (error) {
    tableWrap.hidden = true;
    status.textContent = error instanceof Error ? error.message : 'Unable to load addresses';
    status.className = 'status error';
    count.textContent = 'Could not load submissions';
  } finally {
    refreshButton.disabled = false;
  }
}

refreshButton.addEventListener('click', loadAddresses);
loadAddresses();
</script>
</body>
</html>
